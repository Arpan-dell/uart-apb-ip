name: ci

on:
  push:
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator make
          verilator --version

      - name: Lint RTL (strict)
        run: make lint

      - name: Regression (10 seeds)
        run: make regress SEEDS=10

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-logs
          path: build/regress_*.log
